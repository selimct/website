project:
  type: website
  output-dir: _site

website:
  title: "Furkan Selim Cetin"
  site-url: "https://furkancetin.dev"
  description: "Personal academic website of Furkan Selim Cetin."
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: publications/index.qmd
        text: Publications
      - href: projects/index.qmd
        text: Projects
      - href: notes/index.qmd
        text: Notes
    right:
      - icon: github
        href: https://github.com/selimct
        aria-label: GitHub
      - icon: gitlab
        href: https://gitlab.com/selimct
        aria-label: GitLab
      - icon: envelope
        href: mailto:mail@furkancetin.dev
        aria-label: Email
  page-footer:
    left: "© 2026 Furkan Selim Cetin"
    right: "Built with Quarto and hosted on Cloudflare Pages"
